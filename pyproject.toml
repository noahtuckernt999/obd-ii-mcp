[project]
name = "obd-ii-mcp"
version = "0.1.0"
description = "A read-only MCP server for Bluetooth ELM327-style OBD-II adapters."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.21.0",
    "pydantic>=2.7",
    "pyserial>=3.5",
]

[project.scripts]
obd-ii-mcp = "obd_ii_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
